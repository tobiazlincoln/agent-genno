<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body { margin:0; width:1440px; height:810px; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:
           radial-gradient(1100px 480px at 50% -8%, rgba(63,74,110,.85), transparent 65%),
           radial-gradient(900px 420px at 85% 30%, rgba(169,138,148,.28), transparent 60%),
           linear-gradient(180deg,#262e3d,#20242f 40%,#171a22 70%,#101318);
         font-family:-apple-system,"Segoe UI",Inter,sans-serif; color:#fff; }
  .grid { position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:56px 56px; }
  .ring { position:absolute; width:520px; height:520px; border:1px dashed rgba(245,215,142,.25); border-radius:50%; }
  svg { filter:drop-shadow(0 0 40px rgba(245,215,142,.4)); }
  h1 { font-size:88px; font-weight:800; letter-spacing:14px; margin:34px 0 10px; }
  h1 .gold { color:#f5d78e; }
  p { color:rgba(255,255,255,.7); font-size:22px; letter-spacing:1px; }
  .chain { margin-top:26px; font-size:14px; color:rgba(255,255,255,.45); letter-spacing:4px; text-transform:uppercase; }
  .kicker { position:absolute; bottom:60px; display:flex; gap:36px; color:rgba(255,255,255,.5); font-size:15px; letter-spacing:2px; }
</style></head><body>
  <div class="grid"></div><div class="ring"></div>
  <svg width="150" height="150" viewBox="0 0 48 48" fill="none">
    <circle cx="24" cy="24" r="21" stroke="rgba(245,215,142,0.35)" stroke-width="1.2" stroke-dasharray="3 5"/>
    <rect x="13" y="13" width="22" height="22" rx="6" transform="rotate(45 24 24)" fill="url(#g)"/>
    <path d="M17.5 24.5 L22 29 L31 19.5" stroke="#1a1d26" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42.5" cy="15" r="2.4" fill="#5ee7a0"/><circle cx="6" cy="33" r="2" fill="rgba(255,255,255,0.55)"/>
    <defs><linearGradient id="g" x1="13" y1="13" x2="35" y2="35"><stop offset="0" stop-color="#f8e3a8"/><stop offset="1" stop-color="#e9b84c"/></linearGradient></defs>
  </svg>
  <h1>AGENT <span class="gold">GENNO</span></h1>
  <p>Soulbound achievement badges for .ai agents</p>
  <div class="chain">BNB Smart Chain · Agent ID Hackathon Entry</div>
  <div class="kicker"><span>NO OWNER</span><span>·</span><span>ZERO APPROVALS</span><span>·</span><span>VERIFIED ON BSCSCAN</span></div>
</body></html>
